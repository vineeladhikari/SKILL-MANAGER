<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Usage Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .platform-select {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .platform-btn {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .platform-btn:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .platform-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .entries-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .entry-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .entry-platform {
            font-weight: 600;
            color: #667eea;
            font-size: 1.1rem;
        }

        .entry-time {
            color: #666;
            font-size: 0.9rem;
        }

        .entry-details {
            color: #555;
            line-height: 1.6;
        }

        .delete-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-left: 10px;
        }

        .delete-btn:hover {
            background: #ff3838;
        }

        .stats-card {
            grid-column: 1 / -1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 15px;
            color: white;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📱 Social Media Usage Tracker</h1>
            <p>Track and analyze your social media habits</p>
        </header>

        <div class="main-content">
            <!-- Entry Form -->
            <div class="card">
                <h2>Add New Entry</h2>
                <form id="entryForm">
                    <div class="form-group">
                        <label>Select Platform</label>
                        <div class="platform-select">
                            <button type="button" class="platform-btn" data-platform="Instagram">
                                📷 Instagram
                            </button>
                            <button type="button" class="platform-btn" data-platform="Facebook">
                                👍 Facebook
                            </button>
                            <button type="button" class="platform-btn" data-platform="Twitter">
                                🐦 Twitter
                            </button>
                            <button type="button" class="platform-btn" data-platform="TikTok">
                                🎵 TikTok
                            </button>
                            <button type="button" class="platform-btn" data-platform="YouTube">
                                ▶️ YouTube
                            </button>
                            <button type="button" class="platform-btn" data-platform="LinkedIn">
                                💼 LinkedIn
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="duration">Duration (minutes)</label>
                        <input type="number" id="duration" min="1" required placeholder="e.g., 30">
                    </div>

                    <div class="form-group">
                        <label for="activity">Activity Type</label>
                        <select id="activity" required>
                            <option value="">Select activity...</option>
                            <option value="Scrolling">Scrolling Feed</option>
                            <option value="Posting">Creating/Posting Content</option>
                            <option value="Messaging">Messaging/Chatting</option>
                            <option value="Watching">Watching Videos</option>
                            <option value="Shopping">Shopping/Browsing</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="notes">Notes (optional)</label>
                        <input type="text" id="notes" placeholder="Any additional thoughts...">
                    </div>

                    <button type="submit" class="submit-btn">Add Entry</button>
                </form>
            </div>

            <!-- Recent Entries -->
            <div class="card">
                <h2>Recent Entries</h2>
                <div id="entriesList" class="entries-list">
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        <p>No entries yet. Start tracking your usage!</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Statistics -->
        <div class="card stats-card">
            <h2>📊 Usage Statistics</h2>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value" id="totalTime">0</div>
                    <div class="stat-label">Total Minutes Today</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="totalEntries">0</div>
                    <div class="stat-label">Total Entries</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="topPlatform">-</div>
                    <div class="stat-label">Most Used Platform</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="avgSession">0</div>
                    <div class="stat-label">Avg. Session (min)</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let entries = JSON.parse(localStorage.getItem('socialMediaEntries')) || [];
        let selectedPlatform = '';

        // Platform selection
        document.querySelectorAll('.platform-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedPlatform = this.dataset.platform;
            });
        });

        // Form submission
        document.getElementById('entryForm').addEventListener('submit', function(e) {
            e.preventDefault();

            if (!selectedPlatform) {
                alert('Please select a platform');
                return;
            }

            const entry = {
                id: Date.now(),
                platform: selectedPlatform,
                duration: parseInt(document.getElementById('duration').value),
                activity: document.getElementById('activity').value,
                notes: document.getElementById('notes').value,
                timestamp: new Date().toISOString()
            };

            entries.unshift(entry);
            localStorage.setItem('socialMediaEntries', JSON.stringify(entries));

            // Reset form
            this.reset();
            document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
            selectedPlatform = '';

            renderEntries();
            updateStats();
        });

        function renderEntries() {
            const container = document.getElementById('entriesList');
            
            if (entries.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        <p>No entries yet. Start tracking your usage!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = entries.slice(0, 10).map(entry => {
                const date = new Date(entry.timestamp);
                const timeStr = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

                return `
                    <div class="entry-item">
                        <div class="entry-header">
                            <span class="entry-platform">${entry.platform}</span>
                            <div>
                                <span class="entry-time">${dateStr} ${timeStr}</span>
                                <button class="delete-btn" onclick="deleteEntry(${entry.id})">Delete</button>
                            </div>
                        </div>
                        <div class="entry-details">
                            <strong>Duration:</strong> ${entry.duration} minutes<br>
                            <strong>Activity:</strong> ${entry.activity}
                            ${entry.notes ? `<br><strong>Notes:</strong> ${entry.notes}` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function deleteEntry(id) {
            entries = entries.filter(e => e.id !== id);
            localStorage.setItem('socialMediaEntries', JSON.stringify(entries));
            renderEntries();
            updateStats();
        }

        function updateStats() {
            const today = new Date().toDateString();
            const todayEntries = entries.filter(e => new Date(e.timestamp).toDateString() === today);
            
            const totalTime = todayEntries.reduce((sum, e) => sum + e.duration, 0);
            const totalEntries = entries.length;
            
            // Calculate most used platform
            const platformCounts = {};
            entries.forEach(e => {
                platformCounts[e.platform] = (platformCounts[e.platform] || 0) + e.duration;
            });
            const topPlatform = Object.keys(platformCounts).length > 0 
                ? Object.keys(platformCounts).reduce((a, b) => platformCounts[a] > platformCounts[b] ? a : b)
                : '-';
            
            const avgSession = totalEntries > 0 
                ? Math.round(entries.reduce((sum, e) => sum + e.duration, 0) / totalEntries)
                : 0;

            document.getElementById('totalTime').textContent = totalTime;
            document.getElementById('totalEntries').textContent = totalEntries;
            document.getElementById('topPlatform').textContent = topPlatform;
            document.getElementById('avgSession').textContent = avgSession;
        }

        // Initialize
        renderEntries();
        updateStats();
    </script>
</body>
</html>
