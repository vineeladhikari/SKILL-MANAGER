<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skill Gap Analyzer</title>
<style>
:root{--bg:#f1efff;--card:#fff;--ink:#1d1750;--mute:#5f5a8a;--line:#dcd8f5;--acc:#5b3df5;--acc2:#00b8a9;--h1:#5b3df5;--h2:#00b8a9;--ok:#0e8f7e;--warn:#c2410c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120f2b;--card:#1d1942;--ink:#efecff;--mute:#a9a4d6;--line:#352f69;--acc:#8c7bff;--acc2:#2dd4bf;--h1:#3b2bb5;--h2:#0d8f88;--ok:#2dd4bf;--warn:#fb923c}}
:root[data-theme="dark"]{--bg:#120f2b;--card:#1d1942;--ink:#efecff;--mute:#a9a4d6;--line:#352f69;--acc:#8c7bff;--acc2:#2dd4bf;--h1:#3b2bb5;--h2:#0d8f88;--ok:#2dd4bf;--warn:#fb923c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:32px 16px}
h1{font:700 28px/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px}
p.sub{color:var(--mute);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 10px 30px rgba(91,61,245,.12)}
.hero{background:linear-gradient(135deg,var(--h1),var(--h2));border-radius:14px;padding:20px 20px 0;margin-bottom:16px;color:#fff;overflow:hidden}
.hero h1{color:#fff}.hero p.sub{color:#e6f7f5;margin-bottom:8px}
.hero svg{display:block;width:100%;height:auto;max-height:190px}
label{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.row{grid-template-columns:1fr}}
button{margin-top:24px;padding:12px 22px;border:0;border-radius:8px;background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;font:600 16px inherit;cursor:pointer}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
.err{color:var(--warn);font-size:13px;min-height:18px;margin-top:4px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--h1),var(--acc2));transition:width .5s}
.sk{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.sk input{width:auto}.sk span{flex:1}.sk small{color:var(--mute)}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.gap{color:var(--warn)}.have{color:var(--ok)}
ul{padding-left:20px}
[hidden]{display:none}
</style>
</head>
<body>
<main>
<div class="hero">
<h1>Skill Gap Analyzer</h1>
<p class="sub">See which skills you already have for your target job and what to learn next.</p>
<svg viewBox="0 0 520 190" role="img" aria-label="Illustration of a student climbing steps toward a flag marking the target job">
<rect x="20" y="150" width="90" height="40" rx="4" fill="#fff" opacity=".35"/>
<rect x="110" y="120" width="90" height="70" rx="4" fill="#fff" opacity=".5"/>
<rect x="200" y="90" width="90" height="100" rx="4" fill="#fff" opacity=".65"/>
<rect x="290" y="60" width="90" height="130" rx="4" fill="#fff" opacity=".8"/>
<rect x="380" y="30" width="110" height="160" rx="4" fill="#fff"/>
<path d="M65 140l120-30 105-30 100-30" stroke="#ffd166" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
<circle cx="65" cy="140" r="7" fill="#ffd166"/><circle cx="155" cy="110" r="7" fill="#ffd166"/><circle cx="245" cy="80" r="7" fill="#ffd166"/><circle cx="335" cy="50" r="7" fill="#ffd166"/>
<line x1="435" y1="30" x2="435" y2="-5" stroke="#ffd166" stroke-width="3"/>
<path d="M435 -5l38 11-38 11z" fill="#ffd166"/>
<text x="403" y="85" font-size="13" font-weight="700" fill="#5b3df5" font-family="Segoe UI,sans-serif">Java</text>
<text x="403" y="102" font-size="13" font-weight="700" fill="#5b3df5" font-family="Segoe UI,sans-serif">Developer</text>
<text x="38" y="175" font-size="12" font-weight="600" fill="#5b3df5" font-family="Segoe UI,sans-serif">You</text>
</svg>
</div>

<section id="s1" class="card">
  <label for="name">Name</label>
  <input id="name" autocomplete="name">
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="email">
  <div class="row">
    <div><label for="edu">Education</label>
      <select id="edu"><option>B.Tech</option><option>M.Tech</option><option>BCA</option><option>MCA</option><option>B.Sc</option></select></div>
    <div><label for="branch">Branch</label>
      <select id="branch"><option>CSE</option><option>IT</option><option>ECE</option><option>EEE</option><option>Mechanical</option><option>Civil</option></select></div>
    <div><label for="year">Year</label>
      <select id="year"><option>1st Year</option><option>2nd Year</option><option selected>3rd Year</option><option>4th Year</option></select></div>
    <div><label for="exp">Experience</label>
      <select id="exp"><option>Fresher</option><option>0–1 years</option><option>1–3 years</option></select></div>
  </div>
  <label for="job">Target job</label>
  <select id="job"></select>
  <div class="err" id="err" role="alert"></div>
  <button id="next">Next</button>
</section>

<section id="s2" class="card" hidden>
  <h2 style="margin:0 0 4px;font-size:20px">Tick the skills you already have</h2>
  <p class="sub" id="s2sub" style="margin-bottom:12px"></p>
  <div id="list"></div>
  <button id="analyze">Analyze my gap</button>
  <button class="ghost" id="back1" style="margin-left:8px">Back</button>
</section>

<section id="s3" class="card" hidden>
  <h2 id="rtitle" style="margin:0 0 4px;font-size:20px"></h2>
  <div class="bar"><i id="fill" style="width:0"></i></div>
  <p id="score" class="sub"></p>
  <h3 class="have" style="margin-bottom:4px">You have</h3><ul id="have"></ul>
  <h3 class="gap" style="margin-bottom:4px">Learn next, in this order</h3><ul id="gaps"></ul>
  <button class="ghost" id="back2">Edit skills</button>
  <button class="ghost" id="restart" style="margin-left:8px">Start over</button>
</section>
</main>

<script>
// Skills are listed in recommended learning order; "need" = core for a fresher role.
const JOBS={
"Java Developer":["Core Java & OOP","Collections & Generics","Multithreading","Exception handling & I/O","SQL & JDBC","Data Structures & Algorithms","Git & GitHub","Maven/Gradle","Spring Boot","REST APIs","Hibernate/JPA","JUnit testing","Microservices basics","Docker basics"],
"Python Developer":["Python fundamentals","OOP in Python","Data Structures & Algorithms","SQL","Git & GitHub","Flask/Django","REST APIs","Testing (pytest)","Docker basics"],
"Web Developer":["HTML & CSS","JavaScript (ES6+)","Responsive design","Git & GitHub","React or similar","Node.js basics","REST APIs","SQL/NoSQL basics","Deployment basics"],
"Data Analyst":["Excel","SQL","Python (pandas)","Statistics","Data visualization","Power BI/Tableau","Data cleaning","Communication"],
"Full Stack Developer":["HTML, CSS, JavaScript","React or similar","Node.js/Express or Spring Boot","REST APIs","SQL & NoSQL","Git & GitHub","Authentication","Docker basics","Deployment basics"]
};
const $=id=>document.getElementById(id);
const show=n=>["s1","s2","s3"].forEach((s,i)=>$(s).hidden=i!==n-1);
$("job").innerHTML=Object.keys(JOBS).map(j=>`<option>${j}</option>`).join("");
let skills=[],have=new Set(),store={};
try{const d=JSON.parse(localStorage.getItem("sga")||"{}");if(d.name)$("name").value=d.name;if(d.email)$("email").value=d.email}catch(e){}

$("next").onclick=()=>{
  const n=$("name").value.trim(),e=$("email").value.trim();
  if(!n){$("err").textContent="Enter your name.";return}
  if(!/^\S+@\S+\.\S+$/.test(e)){$("err").textContent="Enter a valid email address.";return}
  $("err").textContent="";
  try{localStorage.setItem("sga",JSON.stringify({name:n,email:e}))}catch(x){}
  skills=JOBS[$("job").value];
  $("s2sub").textContent=`${n}, these are the skills employers expect for a ${$("job").value} (${$("exp").value.toLowerCase()}).`;
  $("list").innerHTML=skills.map((s,i)=>`<label class="sk"><input type="checkbox" data-i="${i}" ${have.has(s)?"checked":""}><span>${s}</span></label>`).join("");
  show(2);
};
$("back1").onclick=()=>show(1);
$("analyze").onclick=()=>{
  have=new Set([...document.querySelectorAll("#list input:checked")].map(c=>skills[c.dataset.i]));
  const got=skills.filter(s=>have.has(s)),miss=skills.filter(s=>!have.has(s));
  const pct=Math.round(got.length/skills.length*100);
  $("rtitle").textContent=`${$("name").value.trim()}, you're ${pct}% ready for ${$("job").value}`;
  $("score").textContent=`${got.length} of ${skills.length} skills covered. ${$("year").value} ${$("edu").value} ${$("branch").value}.`;
  $("have").innerHTML=got.length?got.map(s=>`<li>${s}</li>`).join(""):"<li>None selected yet.</li>";
  $("gaps").innerHTML=miss.length?miss.map(s=>`<li>${s}</li>`).join(""):"<li>No gaps. Start building projects and applying.</li>";
  show(3);requestAnimationFrame(()=>$("fill").style.width=pct+"%");
};
$("back2").onclick=()=>{$("fill").style.width="0";show(2)};
$("restart").onclick=()=>{have=new Set();$("fill").style.width="0";show(1)};
</script>
</body>
</html>
