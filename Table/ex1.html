<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Position Demo</title>
  <style>
    .box {
      width: 120px;
      height: 120px;
      color: white;
      text-align: center;
      line-height: 120px;
      font-weight: bold;
    }

    .static {
      background: teal;
      position: static; /* default */
    }

    .relative {
      background: orange;
      position: relative;
      top: 20px;   /* moves down */
      left: 20px;  /* moves right */
    }

    .absolute {
      background: crimson;
      position: absolute;
      top: 50px;
      left: 200px;
    }

    .fixed {
      background: purple;
      position: fixed;
      bottom: 10px;
      right: 10px;
    }

    .sticky {
      background: green;
      position: sticky;
      top: 0; /* sticks to top when scrolling */
    }

    .container {
      height: 200px;
      border: 2px dashed gray;
      margin-bottom: 50px;
      position: relative; /* important for absolute child */
    }
  </style>
</head>
<body>
  <h2>CSS Position Examples</h2>

  <div class="box static">Static</div>
  <div class="box relative">Relative</div>

  <div class="container">
    <div class="box absolute">Absolute</div>
  </div>

  <div class="box sticky">Sticky</div>

  <p style="height: 1000px;">
    Scroll down to see how <b>sticky</b> and <b>fixed</b> behave differently.
  </p>

  <div class="box fixed">Fixed</div>
</body>
</html>
